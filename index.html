<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JK Deals Shopping</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5;color:#222}
header{background:#111;color:white;padding:20px;text-align:center}
nav{background:#ff9800;padding:12px;text-align:center}
nav a{color:#111;margin:10px;text-decoration:none;font-weight:bold}
.hero{padding:35px 15px;text-align:center;background:#ffe0b2}
button{background:#ff9800;border:0;padding:12px 18px;border-radius:6px;font-weight:bold}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}
.card{background:white;padding:12px;text-align:center;border-radius:10px}
.card img{width:100%;height:130px;object-fit:contain}
input{padding:12px;margin:6px;max-width:90%;border:1px solid #ccc;border-radius:5px}
section{padding:15px}
footer{background:#111;color:white;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
<h1>🛍️ JK Deals</h1>
<p>Your Shopping, Your Deals!</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#login">Login</a>
<a href="#cart">Cart 🛒</a>
</nav>

<section class="hero" id="home">
<h2>Welcome to JK Deals!</h2>
<p>Shop your favourite products at great prices.</p>
<button onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
</section>

<section id="login">
<h2>👤 Login / Sign Up</h2>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg">Login କରିବାକୁ Email ଓ Password ଦିଅ।</p>
</section>

<section id="products">
<h2>🛒 Products</h2>
<div class="products" id="productList"></div>
</section>

<section id="cart">
<h2>🛍️ Your Cart</h2>
<div id="cartItems">Cart is empty.</div>
<h3 id="total">Total: ₹0</h3>
<button onclick="placeOrder()">Place Order</button>
<p id="orderMsg"></p>
</section>

<section id="track">
<h2>📦 Order Tracking</h2>
<input id="orderId" placeholder="Enter Order ID">
<button onclick="trackOrder()">Track Order</button>
<p id="trackMsg"></p>
</section>

<footer>
<p>© 2026 JK Deals</p>
<p>Happy Shopping ❤️</p>
</footer>

<script>
const products=[
{id:1,name:"T-Shirt",price:299,image:"https://placehold.co/300x200?text=T-Shirt"},
{id:2,name:"Shoes",price:799,image:"https://placehold.co/300x200?text=Shoes"},
{id:3,name:"Watch",price:499,image:"https://placehold.co/300x200?text=Watch"},
{id:4,name:"Headphones",price:599,image:"https://placehold.co/300x200?text=Headphones"}
];
let cart=[];
function showProducts(){
document.getElementById("productList").innerHTML=products.map(p=>`
<div class="card">
<img src="${p.image}" alt="${p.name}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
<button onclick="addCart(${p.id})">Add to Cart</button>
</div>`).join("");
}
function addCart(id){
let p=products.find(x=>x.id===id);
cart.push(p);
showCart();
}
function showCart(){
document.getElementById("cartItems").innerHTML=cart.length?
cart.map((p,i)=>`${p.name} - ₹${p.price} <button onclick="removeCart(${i})">Remove</button>`).join("<hr>"):"Cart is empty.";
document.getElementById("total").textContent="Total: ₹"+cart.reduce((s,p)=>s+p.price,0);
}
function removeCart(i){cart.splice(i,1);showCart();}
function login(){
document.getElementById("loginMsg").textContent=
"Demo login only. Firebase Authentication connect କଲେ ପ୍ରକୃତ Login ହେବ।";
}
function placeOrder(){
if(!cart.length){alert("ପ୍ରଥମେ Product Cart ରେ ଯୋଡ଼।");return;}
let id="JK"+Date.now().toString().slice(-6);
document.getElementById("orderMsg").textContent="Demo Order ID: "+id;
document.getElementById("trackMsg").textContent="Order placed (demo).";
cart=[];showCart();
}
function trackOrder(){
document.getElementById("trackMsg").textContent=
"ଏହା Demo Tracking। ପ୍ରକୃତ Tracking ପାଇଁ Database ଦରକାର।";
}
showProducts();
</script>
</body>
</html>
